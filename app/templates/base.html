<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}PriceCompare{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚖️</text></svg>">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/">⚖️ PriceCompare</a>
  <nav><a href="/docs" target="_blank" rel="noopener">API</a></nav>
  {% if mock_mode %}<span class="badge warn" title="MOCK_STORES=1: results are simulated">Demo mode</span>{% endif %}
</header>
<main class="container">{% block content %}{% endblock %}</main>
<footer class="footer">Searches Amazon, Flipkart, Snapdeal and Vijay Sales in parallel and matches the same product across stores.</footer>
</body>
</html>
